services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: escape_the_maze
      POSTGRES_USER: escape_the_maze
      POSTGRES_PASSWORD: escape_the_maze_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

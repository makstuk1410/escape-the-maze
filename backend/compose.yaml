services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: escape_the_maze
      POSTGRES_USER: escape_the_maze
      POSTGRES_PASSWORD: escape_the_maze_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escape_the_maze -d escape_the_maze"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: escape_the_maze
      DB_USERNAME: escape_the_maze
      DB_PASSWORD: escape_the_maze_dev
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWNoYW5nZS1tZQ==}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
